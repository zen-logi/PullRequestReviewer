name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and Publish
        run: |
          dotnet publish PullRequestReviewer/PullRequestReviewer.csproj `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -p:WindowsPackageType=None `
            -p:PublishSingleFile=false `
            -o ./publish

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Installer
        run: |
          iscc /DMyAppVersion="${{ github.ref_name }}" installer/installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PullRequestReviewer-Windows-Installer
          path: output/PullRequestReviewer-Setup.exe
          retention-days: 5

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: PullRequestReviewer-Windows-Installer
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/PullRequestReviewer-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
